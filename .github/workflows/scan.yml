name: WordPress Vulnerability Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  wpscan:
    name: WPScan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start WordPress stack
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress..."
          for i in $(seq 1 24); do
            if curl -sf --max-time 5 http://localhost:8080 > /dev/null 2>&1; then
              echo "WordPress is ready after $i attempts"
              exit 0
            fi
            echo "Attempt $i/24 — not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "WordPress did not become ready in time"
          exit 1

      - name: Install WPScan
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ruby-full build-essential libcurl4-openssl-dev zlib1g-dev
          sudo gem install wpscan

      - name: Run WPScan
        env:
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
        run: |
          mkdir -p scans
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TOKEN_ARG=""
          if [ -n "$WPSCAN_API_TOKEN" ]; then
            TOKEN_ARG="--api-token $WPSCAN_API_TOKEN"
          fi
          wpscan \
            --url http://localhost:8080 \
            --enumerate vp,vt,u,tt,cb,dbe \
            $TOKEN_ARG \
            --format json \
            --output scans/wpscan-${TIMESTAMP}.json \
            --force || true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpscan-results-${{ github.run_number }}
          path: scans/
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down
